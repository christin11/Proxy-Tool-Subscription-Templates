# ============================================================
# Clash Meta 配置模板
# 策略组来源：ACL4SSR_Online_Full_Netflix_Pro (Carrollis-Pro)
# 配置框架来源：Christin11 Clash Templet
# ============================================================

proxy-providers:
  {{AIRPORT_NAME}}: 
    type: http
    interval: 1800
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
    proxy: "🟢 直连"
    url: "{{SUB_URL}}"

global-ua: clash

port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
ipv6: false
allow-lan: true
unified-delay: true
tcp-concurrent: true

geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 48
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"

external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui

find-process-mode: strict
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 30

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.push.apple.com"
    - "+.apple.com"

tun:
  enable: true
  stack: mixed
  mtu: 9000
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - 'doh.pub'
    - 'dns.alidns.com'
    - 'dns.google'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.msftncsi.com'
    - '+.msftconnecttest.com'
    - '+.push.apple.com'

  nameserver:
    - 'https://119.29.29.29/dns-query'
    - 'https://223.5.5.5/dns-query'
    - '223.5.5.5'

  nameserver-policy:
    "geosite:cn": "119.29.29.29"
    "+.google.com": "https://dns.cloudflare.com/dns-query"
    "+.googleapis.com": "https://dns.cloudflare.com/dns-query"
    "+.youtube.com": "https://dns.cloudflare.com/dns-query"
    "+.facebook.com": "https://dns.cloudflare.com/dns-query"
    "+.twitter.com": "https://dns.cloudflare.com/dns-query"
    "+.github.com": "https://dns.cloudflare.com/dns-query"

  fallback-filter:
    geoip: true
    geoip-code: "CN"
    ipcidr:
      - 240.0.0.0/4

proxies:
  - name: "🟢 直连"
    type: direct
    udp: true

# ============================================================
# 策略组
# ============================================================
proxy-groups:

  # ============ 顶层选择组 ============
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🔯 故障转移"
      - "🔮 负载均衡"
      - "🇭🇰 香港节点"
      - "🇹🇼 台湾节点"
      - "🇸🇬 新加坡节点"
      - "🇯🇵 日本节点"
      - "🇺🇲 美国节点"
      - "🇰🇷 韩国节点"
      - "🇬🇧 英国节点"
      - "🚀 手动切换"
      - "🛩️ 其他备用"
      - "🟢 直连"
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png

  - name: "🚀 手动切换"
    type: select
    include-all: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Static.png

  - name: "♻️ 自动选择"
    type: url-test
    include-all: true
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png

  - name: "🔯 故障转移"
    type: fallback
    include-all: true
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png

  - name: "🔮 负载均衡"
    type: load-balance
    include-all: true
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Round_Robin.png

