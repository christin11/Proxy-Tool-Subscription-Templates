ipv6: false
vif_only: false
hijack_dns:
- '*:53'
geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb
proxy_latency_test_url: https://www.epochtimes.com/
direct_latency_test_url: http://connectivitycheck.platform.hicloud.com/generate_204
dns:
  bootstrap:
  - system
  upstreams:
    bestvmr_dns:
    - 47.110.75.65:8053
    cloudflare_doh:
    - https://dns.cloudflare.com/dns-query
    cn_dns:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - tls://dot.pub
    - tls://dns.alidns.com
    fallback_dns:
    - https://dns.google/dns-query
    - tls://1.1.1.1
    - tls://8.8.8.8
  forward:
  - domain_wildcard:
      match: '*.bestvmr.com'
      value: bestvmr_dns
  - domain:
      match: bestvmr.com
      value: bestvmr_dns
  - domain_wildcard:
      match: '*.google.com'
      value: cloudflare_doh
  - domain_wildcard:
      match: '*.googleapis.com'
      value: cloudflare_doh
  - domain_wildcard:
      match: '*.youtube.com'
      value: cloudflare_doh
  - domain_wildcard:
      match: '*.github.com'
      value: cloudflare_doh
  - domain_wildcard:
      match: '*.githubusercontent.com'
      value: cloudflare_doh
  - domain_wildcard:
      match: '*.openai.com'
      value: cloudflare_doh
  - domain_wildcard:
      match: '*.anthropic.com'
      value: cloudflare_doh
  - domain_wildcard:
      match: '*'
      value: cn_dns
  hosts:
    iosapps.itunes.apple.com:
    - iosapps.itunes.apple.com.download.ks-cdn.com
