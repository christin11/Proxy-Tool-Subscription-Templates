# ============ 地区节点分组（url-test 自动择优，按正则从全部订阅节点里筛选） ============
🇭🇰 香港节点 = url-test, policy-regex-filter=(?i)🇭🇰|香港|港|\bHK\b|Hong, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50

🇹🇼 台湾节点 = url-test, policy-regex-filter=(?i)🇹🇼|台湾|台灣|台|\bTW\b|Taiwan, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50

🇯🇵 日本节点 = url-test, policy-regex-filter=(?i)🇯🇵|日本|东京|東京|\bJP\b|Japan, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50

🇰🇷 韩国节点 = url-test, policy-regex-filter=(?i)🇰🇷|韩|韓|首尔|\bKR\b|Korea, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50

🇸🇬 新加坡节点 = url-test, policy-regex-filter=(?i)🇸🇬|新加坡|狮|狮城|\bSG\b|Singapore, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50

🇹🇭 泰国节点 = url-test, policy-regex-filter=(?i)🇹🇭|泰国|泰國|曼谷|\bTH\b|Thailand, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50

🇺🇸 美国节点 = url-test, policy-regex-filter=(?i)🇺🇸|美国|洛杉矶|圣何塞|\bUS\b|States|America, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50

🇩🇪 德国节点 = url-test, policy-regex-filter=(?i)🇩🇪|德国|德國|\bDE\b|Germany, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50

🇬🇧 英国节点 = url-test, policy-regex-filter=(?i)🇬🇧|英国|英國|GBR|\bUK\b(?!R)|Kingdom, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50

